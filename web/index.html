<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo 테스트 콘솔</title>
  <style>
    :root { --bg: #f7f7f8; --card: #fff; --line: #e4e4e7; --text: #18181b; --muted: #71717a; --accent: #2563eb; --err: #dc2626; --ok: #16a34a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .muted { color: var(--muted); font-size: 13px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
    .card h2 { font-size: 15px; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1; min-width: 120px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
    pre { margin: 12px 0 0; padding: 10px; background: #fafafa; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
    .err { color: var(--err); }
    .ok { color: var(--ok); }
  </style>
</head>
<body>
<main>
  <h1>todo 테스트 콘솔</h1>
  <div class="muted">API: <span id="api-base"></span></div>

  <section class="card">
    <h2>로그인</h2>
    <form id="login-form" class="row">
      <input name="user_id" placeholder="user_id" required>
      <input name="password" type="password" placeholder="password" required>
      <button type="submit">로그인</button>
    </form>
    <pre id="login-result">아직 요청 없음</pre>
  </section>
</main>

<script>
  // 페이지(web)와 API(todo)는 출처가 다르다 → 브라우저의 CORS 검사 대상
  const API_BASE = location.hostname === 'localhost'
    ? 'http://localhost:8080'
    : 'https://todo.pita-pat.com';
  document.getElementById('api-base').textContent = API_BASE;

  async function api(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    const token = sessionStorage.getItem('accessToken');
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const res = await fetch(API_BASE + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }
    return { status: res.status, data };
  }

  function show(el, ok, content) {
    el.className = ok ? 'ok' : 'err';
    el.textContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const out = document.getElementById('login-result');
    const form = new FormData(e.target);
    try {
      const { status, data } = await api('POST', '/api/v1/auth/login', {
        user_id: form.get('user_id'),
        password: form.get('password'),
      });
      if (status === 200) {
        sessionStorage.setItem('accessToken', data.accessToken);
        sessionStorage.setItem('userId', form.get('user_id'));
        show(out, true, `로그인 성공 (status ${status})`);
      } else {
        show(out, false, { status, ...data });
      }
    } catch (err) {
      // CORS 로 막히면 응답 내용 없이 여기로 온다
      show(out, false, `요청 실패: ${err.name}: ${err.message}\n→ 브라우저 콘솔(Console)과 Network 탭을 확인하세요`);
    }
  });
</script>
</body>
</html>
