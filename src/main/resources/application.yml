spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  application:
    name: todo
  datasource:
    hikari:
      maximum-pool-size: 25
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: localhost
      port: 6381
  cache:
    type: redis
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${USER_EMAIL}
    password: ${USER_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000 # 연결 맺는데 최대 시간
          timeout: 5000           # 연결 후 응답 대기 시간
          writetimeout: 5000      # 쓰기 작업 최대 시간

management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    org.springframework.cache: trace

jwt:
  secret: ${JWT_SECRETS}
  accessTokenExpiration: ${JWT_ACCESS_TOKEN_EXPIRED_TIME}
  refreshTokenExpiration: ${JWT_REFRESH_TOKEN_EXPIRED_TIME}

outbox:
  poller:
    enabled: true           # false 면 폴러 빈을 만들지 않는다(크래시 복구 실험의 "폴러 OFF" 용)
    fixed-delay: 120000     # 2분
    stale-threshold: 180000 # 3분
  dlq-reconciler:
    fixed-delay: 300000 # 5분 - 사실은 발송에 성공했는데 DLQ로 먼저 이관된 이벤트를 archive로 되돌리는 배치 주기

email:
  reconciler:
    fixed-delay: 300000 # 5분 - markSentAt 기록 실패로 READY에 멈춘 레코드를 SENT로 되돌리는 배치 주기
