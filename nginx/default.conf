server {
    listen 80;
    server_name _;                      # 아무 도메인/IP로 와도 받음

    location / {
        proxy_pass http://server:8080;  # compose 내부 네트워크의 server 컨테이너로 전달

        # 원래 요청 정보를 앱에 넘겨주기 (안 넘기면 앱 입장에선 모든 요청이 nginx에서 온 것처럼 보임)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
