# Cloudflare IPv4 대역 (출처: https://www.cloudflare.com/ips-v4, 2026-10-17 기준)
# 이 대역에서 온 연결만 허용 + 실제 클라이언트 IP 복원에 사용
geo $realip_remote_addr $allowed_source {
    default          0;
    172.16.0.0/12    1;   # 서버 내부 테스트용 (호스트 → docker 네트워크)
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
}

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name _;
    if ($allowed_source = 0) { return 444; }
    return 308 https://$host$request_uri;
}

# 서비스 도메인이 아닌 Host로 온 요청은 연결 종료
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name todo.pita-pat.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    if ($allowed_source = 0) { return 444; }

    location / {
        proxy_pass http://server:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;   # real_ip 적용 후 = 실제 사용자 IP
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;          # 클라이언트가 보낸 값을 덮어씀 (Tomcat RemoteIpValve가 신뢰하는 헤더)
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name web.pita-pat.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    if ($allowed_source = 0) { return 444; }

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
